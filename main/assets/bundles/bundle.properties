item.rout-router-dust.details= Like dust in the wind. Except the dust is router
item.rout-router-fragment.name = Router Fragment
item.rout-router-fragment.description = Partially intact router specimen. Useful for basic infrastructure and router transmutation.
item.rout-router-fragment.details = It's almost like those broken heart keychains.
item.rout-routerium.name = Routerium
item.rout-routerium.description = A pure router specimen, useful for advanced structures, weaponry, and expanding your influence.
item.rout-routerium.details = It's routing halls are endlessly routing for a route yet to be known or routed upon.
