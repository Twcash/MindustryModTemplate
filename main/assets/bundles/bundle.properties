block.rout-big-router-drill.description = Mines router dust from router substrate underneath the structure. Capable of harvesting pure fragments from pure router substrate.
block.rout-big-router-drill.details = Reverse bonk?

block.rout-router2.name = Router
block.rout-router2.description = Distributes items round-robin among all sides.
block.rout-router2.details = THEY CALLED US EVIL! MAKE THEM PAY!
block.rout-duct-router2.name = Duct Router
block.rout-duct-router2.description = A smarter router. Distributes items to the sides round-robin style, however only accepts inputs from the back and can sort.
block.rout-duct-router2.details = How are we supposed to filter the items if most of them are a shade of grey???
block.rout-liquid-router2.name = Liquid Router
block.rout-liquid-router2.description =  Distributes liquid evenly to all sides.
block.rout-liquid-router2.details = It's a router, for liquid router
block.rout-payload-router.name = Payload Router
block.rout-payload-router.description = Distributes large routers round-robin style in every direction but the input.
block.rout-payload-router.details = Routers routing routers...
block.rout-router-wall.name = Router Wall
block.rout-router-wall.description = Defends routers with its girth.
block.rout-router-wall.details = Unnecessary good.
block.rout-router-compressor.name = Router Compressor
block.rout-router-compressor.description = Compresses router dust into router fragments at a heavy loss.
block.rout-router-compressor.details = It's a router compress router world out there...
block.rout-router-melter.name = Router Melter
block.rout-router-melter.description = Melts router dust into cold, delicious liquid router at a heavy loss.
block.rout-router-melter.details = What? I thought whitches melted with water, there's no water here...
block.rout-router-heater.name = Router Heater
block.rout-router-heater.description = Heats routerium with liquid router to create pure liquid routerium.
block.rout-router-heater.details = Soup bowl.
block.rout-router-fabricator.name = Router Fabricator
block.rout-router-fabricator.description =  Creates semi-mobile variants of routers for further refinement.
block.rout-router-fabricator.details =  Before the router, there was the fabricator, before the fabricator, there was the router.
block.rout-router-tansmutator.name = Router Transmutator
block.rout-router-tansmutator.description = Transmutes routers inside into their alternative variants.
block.rout-router-tansmutator.details = I shudder to think what machinations involve lathering routers in liquid router.
block.rout-router-defabricator.name = Router Defabricator
block.rout-router-defabricator.description = Dissasembles routers inside for their refined components.
block.rout-router-defabricator.details = This is not the end for them. They are going to a better life.
block.rout-core-route.name = Core: Route
block.rout-core-route.description = A crude core capable of expanding the router substrate. Upon destruction will collapse the substrate. If no other cores remain the sector is lost.
block.rout-core-route.details = There is no escape.
block.rout-core-routine.name = Core: Routine
block.rout-core-routine.description = A basic core capable of moderately expanding the router substrate. Upon destruction will collapse the substrate. If no other cores remain the sector is lost.
block.rout-core-routine.details = There is no salvation.
block.rout-core-deroute.description = An advanced core capable of greatly expanding the router substrate. Upon destruction will collapse the substrate. If no other cores remain the sector is lost.
block.rout-core-deroute.details = There is no queen of England.
block.rout-router-turbine.name = Router Turbine
block.rout-router-turbine.description = Uses hot routerium to spin a turbine, generating power.
block.rout-router-turbine.details = Soup rotation machine.
block.rout-metaphysical-router.name = Metaphysical Router
block.rout-metaphysical-router.description = Capable of routing at a distance. Handle with care.
block.rout-metaphysical-router.details = A strange machination capable of quantum routing items away and to its physical form.

liquid.slag.name = Liquid routerium
liquid.slag.description = Very hot liquid routerium. Used for casting liquid routers with the router fabricator, or with router turbines to produce power.
liquid.slag.details= Soup flavored router
